apiVersion: 1

datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: caltech_lab
      defaultBucket: qgc_data
      tlsSkipVerify: true
    secureJsonData:
      token: replace_with_long_token
